name: Deploy CDK Infrastructure

# Define cuándo se activará el pipeline (por ejemplo, en cada push a la rama master)
on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar la versión de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar las dependencias del proyecto
      - name: Install dependencies
        run: npm ci

      # 4. Configurar las credenciales de AWS en el entorno de GitHub Actions
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2 # Cambia a tu región de preferencia

      # 5. Ejecutar el despliegue del CDK inyectando las variables del sistema
      - name: CDK Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          URL_GET: ${{ secrets.URL_GET }}
          URL_POST: ${{ secrets.URL_POST }}
          TIMEOUT_MS: ${{ secrets.TIMEOUT_MS }}
          VPC_ID: ${{ secrets.VPC_ID }}
          # Agrega aquí el resto de variables que tu clase BuildConfig requiera
        run: |
          npx cdk deploy --require-approval never